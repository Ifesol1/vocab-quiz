.slots{display:flex;gap:8px;justify-content:center;margin:14px 0}

.slotbox.f{border-style:solid;border-color:var(--ink)}
.parts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.part{border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;background:#fff;min-width:78px;max-width:150px}

.part .m{font-size:13px;color:var(--sub);line-height:1.3}

.fam{margin-top:6px}

.choice{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}

.sblabel{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--sub)}
.note{font-size:14px;color:var(--warn);margin-top:8px}
@media(max-width:480px){.wrap{padding-left:12px;padding-right:12px}.card{padding:14px}header{flex-wrap:wrap}.big{font-size:64px}.py{font-size:26px}.py.s{font-size:19px}.tian{width:130px;height:130px}.tian.small{width:86px;height:86px}.punct{font-size:28px}.tians{gap:6px}.tile{font-size:19px;padding:5px 9px}.chip .c{font-size:19px}.part{min-width:64px}.part .c{font-size:30px}.slotbox{width:52px;height:52px;font-size:28px}}

T:'Time (when) goes before the verb: at the very start or right after the subject. Never at the end like English.',

{u:0,t:'Who does what',idea:'A basic Chinese sentence works like English: <b>Subject → Verb → Object</b>. Each coloured box is a <i>slot</i>. We’ll add one slot at a time.',ex:[{c:'我/S 等/V 你/O',p:'Wǒ děng nǐ.',e:'I wait for you.',en:'I/S|wait for/V|you/O'}],q:{k:'mc',q:'Which one means “I wait for you”?',o:['我等你。','你等我。','等你我。'],a:0,why:'Subject 我 first, then the verb 等, then the object 你. 你等我 means “You wait for me.”'}},
{u:0,t:'Time goes before the verb',idea:'English usually puts time at the end (“…tomorrow morning”). Chinese puts the <b>time before the verb</b>: at the very start, or right after the subject. Both are fine.',ex:[{c:'明天上午/T 我/S 有/V 两节课/O',p:'Míngtiān shàngwǔ wǒ yǒu liǎng jié kè.',e:'I have two classes tomorrow morning.',en:'I/S|have/V|two classes/O|tomorrow morning/T'},{c:'我/S 明天上午/T 有/V 两节课/O',p:'Wǒ míngtiān shàngwǔ yǒu liǎng jié kè.',e:'Same meaning, with the time right after the subject.'}],q:{k:'mc',q:'“I have class this afternoon.”',o:['我今天下午有课。','我有课今天下午。','有课我今天下午。'],a:0,why:'今天下午 (time) must come before the verb 有.'}},
{u:0,t:'Place goes before the verb too',idea:'“In the office”, “at the library”: the <b>在 + place</b> phrase also goes <b>before the verb</b>. English puts it after.',ex:[{c:'我/S 在办公室/P 等/V 你/O',p:'Wǒ zài bàngōngshì děng nǐ.',e:'I’ll wait for you in the office.',en:'I/S|will wait for/V|you/O|in the office/P'}],q:{k:'mc',q:'“I’ll wait for you in the library.”',o:['我在图书馆等你。','我等你在图书馆。','在图书馆我你等。'],a:0,why:'在图书馆 sits before 等. 我等你在图书馆 is English order, and it’s wrong in Chinese.'}},
{u:0,t:'The full skeleton',idea:'Put it together: <b>Subject · Time · Place · Verb · Object</b>. After the verb, English runs almost backwards: object, then place, then time.',ex:[{c:'明天上午/T 我/S 在教室/P 等/V 你/O',p:'Míngtiān shàngwǔ wǒ zài jiàoshì děng nǐ.',e:'Tomorrow morning I’ll wait for you in the classroom.',en:'I/S|will wait for/V|you/O|in the classroom/P|tomorrow morning/T'}],q:{k:'order',id:'o50'}},
{u:0,t:'Helper words sit right before the verb part',idea:'Little words like <b>要</b> (going to), <b>想</b> (want to), <b>不</b> (not), <b>常常</b> (often), <b>才</b> and <b>别</b> go <b>after the subject and time</b>, and <b>before</b> a 在 / 给 phrase and the verb.',ex:[{c:'老师/S 明天/T 要/H 给妈妈/P 打/V 电话/O',p:'Lǎoshī míngtiān yào gěi māma dǎ diànhuà.',e:'The teacher is going to call Mom tomorrow.'}],q:{k:'mc',q:'“Who do you often call?”',o:['你常常给谁打电话？','你给谁打电话常常？','你给谁常常打电话？'],a:0,why:'常常 (a helper) goes before the 给 phrase: 你 · 常常 · 给谁 · 打电话.'}},
{u:0,t:'Questions keep the same order',idea:'Chinese questions don’t move words around. Add <b>吗</b> at the end, or put the question word (<b>哪儿</b>, <b>谁</b>, <b>什么时候</b>) exactly where the answer would go.',ex:[{c:'老师的办公室/S 在/V 哪儿/O',p:'Lǎoshī de bàngōngshì zài nǎr?',e:'Where is the teacher’s office?'},{c:'老师的办公室/S 在/V Van_Hise_1211/O',p:'Lǎoshī de bàngōngshì zài Van Hise 1211.',e:'The answer goes in the same spot.'}],q:{k:'mc',q:'“When are you free?” (polite)',o:['您什么时候有空儿？','什么时候有空儿您？','您有空儿什么时候？'],a:0,why:'什么时候 is a time word, so it goes before the verb, where the answer (明天下午四点以后) would go.'}},
{u:1,t:'要 + thing = want it',idea:'<b>要 + noun</b> means “want (something)”. Say you don’t want it with <b>不要</b>.',ex:[{c:'我/S 要/V 一杯冰水/O',p:'Wǒ yào yì bēi bīngshuǐ.',e:'I want a glass of ice water.'},{c:'我/S 不/H 要/V 啤酒/O',p:'Wǒ bú yào píjiǔ.',e:'I don’t want beer.'}],q:{k:'mc',q:'“I want a cup of tea.”',o:['我要一杯茶。','我一杯茶要。','我要茶一杯。'],a:0,why:'要 (verb) + 一杯茶 (number + measure word + noun).'}},
{u:1,t:'要 + verb = going to',idea:'<b>要 + verb</b> talks about a plan or a scheduled event: “be going to”. To say you’re <i>not</i> going to, use <b>不 + verb</b>.',ex:[{c:'明天下午/T 我/S 要/H 做/V 功课/O',p:'Míngtiān xiàwǔ wǒ yào zuò gōngkè.',e:'Tomorrow afternoon I’m going to do homework.'},{c:'明天/T 我/S 不/H 看/V 电影/O',p:'Míngtiān wǒ bú kàn diànyǐng.',e:'Tomorrow I’m not going to see a movie.'}],q:{k:'mc',q:'“Tomorrow I’m not going to watch a movie.”',o:['明天我不看电影。','明天我看电影不。','明天不我看电影。'],a:0,why:'Not going to = 不 + verb, and 不 sits right before the verb.'}},
{u:1,t:'想 + verb = want to do',idea:'<b>想</b> needs a verb after it: “want to (do something)”. It’s a helper word, so it goes right before the verb.',ex:[{c:'这个周末/T 我/S 想/H 去/V 跳舞/V',p:'Zhège zhōumò wǒ xiǎng qù tiàowǔ.',e:'I want to go dancing this weekend.'}],q:{k:'mc',q:'“I want to go dancing this weekend.”',o:['这个周末我想去跳舞。','我想去跳舞这个周末。','这个周末我去想跳舞。'],a:0,why:'Time (这个周末) goes before the verb, and 想 comes right before 去跳舞.'}},
{u:1,t:'想要 = would like (softer)',idea:'<b>想要</b> + noun is a softer “would like”. Recap: <b>要</b> + noun = want · <b>要</b> + verb = going to · <b>想</b> + verb = want to · <b>想要</b> = would like.',ex:[{c:'我/S 想/H 要/V 一只狗/O',p:'Wǒ xiǎng yào yì zhī gǒu.',e:'I’d like a dog.'}],q:{k:'mc',q:'Pick the word: “我___一杯可乐。” (I want a cola.)',o:['要','想','才'],a:0,why:'可乐 is a thing (a noun), so use 要 (or 想要). 想 on its own needs a verb: 我想喝可乐.'}},
{u:2,t:'给 = give',idea:'As a verb, <b>给</b> means “give”: <b>给 + person + thing</b>.',ex:[{c:'请/H 给/V 我/O 一杯茶/O',p:'Qǐng gěi wǒ yì bēi chá.',e:'Please give me a cup of tea.'}],q:{k:'mc',q:'“Mom gave me a cup of water.”',o:['妈妈给了我一杯水。','妈妈给一杯水了我。','妈妈了给我一杯水。'],a:0,why:'给 + 了 + person + thing. 了 goes right after the verb 给.'}},
{u:2,t:'给 + person goes before the verb',idea:'“Call Mom” is <b>给妈妈打电话</b>, literally “to Mom make a call”. The <b>给 + person</b> phrase takes the same slot as a place: <b>before the verb</b>.',ex:[{c:'妈妈/S 给孩子/P 打/V 电话/O',p:'Māma gěi háizi dǎ diànhuà.',e:'Mom calls the child.',en:'Mom/S|calls/V|the child/P'}],q:{k:'order',id:'o21'}},
{u:3,t:'哪 = which (+ measure word)',idea:'<b>哪</b> works like 这 and 那: it needs a <b>measure word</b> before the noun. Use the polite <b>位</b> for people.',ex:[{c:'你/S 认识/V 哪位老师/O',p:'Nǐ rènshi nǎ wèi lǎoshī?',e:'Which teacher do you know?'},{c:'您/S 是/V 哪位/O',p:'Nín shì nǎ wèi?',e:'Who is this, please? (on the phone)'}],q:{k:'mc',q:'“Which coffee shop do you want to go to?”',o:['你想去哪个咖啡馆？','你想去哪咖啡馆？','你想去咖啡馆哪个？'],a:0,why:'哪 + measure word (个) + noun, sitting where the answer would go.'}},
{u:3,t:'哪 or 哪儿?',idea:'<b>哪</b> = which (with a measure word). <b>哪儿</b> = where. One set phrase skips the measure word: <b>哪国人</b> (which country).',ex:[{c:'你/S 是/V 哪国人/O',p:'Nǐ shì nǎ guó rén?',e:'Which country are you from?'},{c:'老师的办公室/S 在/V 哪儿/O',p:'Lǎoshī de bàngōngshì zài nǎr?',e:'Where is the teacher’s office?'}],q:{k:'mc',q:'“你想去___？” (Where do you want to go?)',o:['哪儿','哪','哪位'],a:0,why:'Where = 哪儿. 哪 on its own means “which” and needs a measure word + noun.'}},
{u:4,t:'上 = last, 下 = next',idea:'<b>上个星期</b> last week · <b>这个星期</b> this week · <b>下个星期</b> next week. Double it for two away: <b>上上个星期</b> (the week before last), <b>下下个星期</b> (the week after next). Months work the same way: 上个月, 下个月.',ex:[{c:'你/S 上个星期/T 做了/V 什么/O',p:'Nǐ shàng ge xīngqī zuò le shénme?',e:'What did you do last week?'}],q:{k:'mc',q:'“the week after next”',o:['下下个星期','上上个星期','下个星期'],a:0,why:'下 = next, so 下下 = the one after next.'}},
{u:4,t:'Years: 去年 · 今年 · 明年',idea:'Years don’t use 上/下 or 个. They work like 昨天 · 今天 · 明天: <b>去年</b> last year · <b>今年</b> this year · <b>明年</b> next year.',ex:[{c:'小高/S 明年六月/T 才/H 去/V 中国/O',p:'Xiǎo Gāo míngnián liùyuè cái qù Zhōngguó.',e:'Little Gao isn’t going to China until June next year.'}],q:{k:'mc',q:'“last year”',o:['去年','上个年','昨年'],a:0,why:'Last year is 去年, and 年 never takes 个.'}},
{u:4,t:'Counting time: 个 or not?',idea:'<b>年 · 天 · 分钟</b> take <b>no</b> measure word: 一年, 两天, 二十五分钟. <b>月 · 星期 · 小时</b> need <b>个</b>: 两个月, 一个星期, 三个小时.',ex:[{c:'我/S 学了/V 三个月/D 中文/O',p:'Wǒ xué le sān ge yuè Zhōngwén.',e:'I have studied Chinese for three months.'}],q:{k:'mc',q:'“two days”',o:['两天','两个天','二天'],a:0,why:'天 takes no 个, and when counting things 2 is 两.'}},
{u:4,t:'When goes before, how long goes after',idea:'<b>When</b> (明天, 四点, 一个星期 “per week”) goes <b>before</b> the verb. <b>How long</b> (五天, 三个月) goes <b>after</b> the verb, before the object.',ex:[{c:'我/S 一个星期/T 学/V 五天/D 中文/O',p:'Wǒ yí ge xīngqī xué wǔ tiān Zhōngwén.',e:'I study Chinese five days a week.'}],q:{k:'order',id:'o35'}},
{u:4,t:'Big to small: day → part of day → clock',idea:'Time phrases go from big to small: <b>明天 · 下午 · 三点</b>. Parts of the day: 早上 (6–8) · 上午 (8–12) · 中午 (12–1) · 下午 (1–5) · 晚上 (5–12).',ex:[{c:'常老师/S 明天下午三点/T 要/H 给二年级/P 考试/V',p:'Cháng lǎoshī míngtiān xiàwǔ sān diǎn yào gěi èr niánjí kǎo shì.',e:'Teacher Chang is giving the second-years a test at 3 p.m. tomorrow.'}],q:{k:'mc',q:'“at 3 p.m. tomorrow”',o:['明天下午三点','三点下午明天','下午三点明天'],a:0,why:'Biggest unit first: day (明天), part of day (下午), clock time (三点).'}},
{u:5,t:'X 以后 = after X',idea:'English says “<i>after</i> class”. Chinese flips it: <b>下课以后</b> (class over + after). It’s a time phrase, so it goes <b>before the verb</b>.',ex:[{c:'下课以后/T ，/X 我/S 要/H 去/V 图书馆/O 看书/V',p:'Xià kè yǐhòu, wǒ yào qù túshūguǎn kàn shū.',e:'After class, I’m going to the library to read.'}],q:{k:'mc',q:'“after four o’clock”',o:['四点以后','以后四点','四点后以'],a:0,why:'The time first, then 以后.'}},
{u:5,t:'Action + 以后',idea:'For “after doing something”, use <b>verb + 了 + object + 以后</b>, then say what happens next.',ex:[{c:'看了电影以后/T ，/X 我们/S 去/V 吃饭/V 吧/E',p:'Kàn le diànyǐng yǐhòu, wǒmen qù chī fàn ba.',e:'After the movie, let’s go eat.'}],q:{k:'order',id:'o40'}},
{u:5,t:'以后 + 才 = not until after',idea:'<b>才</b> means “later than you’d expect”. With 以后 it means “not until after…”. 才 is a helper word: right before the verb.',ex:[{c:'我/S 明天四点以后/T 才/H 有空/V',p:'Wǒ míngtiān sì diǎn yǐhòu cái yǒu kòng.',e:'I’m not free until after four tomorrow.'}],q:{k:'mc',q:'“I’m not free until after four tomorrow.”',o:['我明天四点以后才有空。','我明天才四点以后有空。','我明天四点以后有空才。'],a:0,why:'The time phrase first, then 才 right before the verb 有空.'}},
{u:6,t:'要是…，…吧',idea:'<b>要是</b> + situation, then the result. Ending the result with <b>吧</b> turns it into a suggestion (“let’s…”).',ex:[{c:'要是/C 你/S 有空儿/V ，/X 我们/S 去/V 吃/V 中国菜/O 吧/E',p:'Yàoshi nǐ yǒu kòngr, wǒmen qù chī Zhōngguó cài ba.',e:'If you’re free, let’s go eat Chinese food.'}],q:{k:'order',id:'o44'}},
{u:6,t:'Polite 要是 from the dialogue',idea:'Li You uses 要是 to be polite to her teacher: “if it’s convenient for you…”. Notice <b>您</b> (polite you) and <b>行吗</b> at the end.',ex:[{c:'要是/C 您/S 方便/V ，/X 四点半/T 我/S 到您的办公室/P 去/V ，/X 行吗/E',p:'Yàoshi nín fāngbiàn, sì diǎn bàn wǒ dào nín de bàngōngshì qù, xíng ma?',e:'If it’s convenient for you, I’ll go to your office at 4:30. Is that OK?'}],q:{k:'mc',q:'“If you’re not busy tomorrow, let’s go see a movie.”',o:['要是明天你不忙，我们去看电影吧。','明天你不忙要是，我们去看电影吧。','我们去看电影吧，明天你不忙要是。'],a:0,why:'要是 starts the “if” part. (It can also come right after the subject: 你要是明天不忙….)'}},
{u:7,t:'Wait for someone somewhere',idea:'<b>Person 1 + 在 + place + 等 + person 2</b>. The place goes before 等. <b>等一下</b> = wait a moment.',ex:[{c:'我/S 在图书馆/P 等/V 你/O ，/X 行吗/E',p:'Wǒ zài túshūguǎn děng nǐ, xíng ma?',e:'I’ll wait for you in the library, OK?'}],q:{k:'order',id:'o49'}},
{u:8,t:'到 = arrive',idea:'On its own, <b>到</b> means “arrive”: 我到了 = I’m here / I’ve arrived.',ex:[{c:'他/S 到/V 图书馆/O 了/E',p:'Tā dào túshūguǎn le.',e:'He arrived at the library.'}],q:{k:'mc',q:'“I’ve arrived.”',o:['我到了。','我了到。','了我到。'],a:0,why:'了 comes after the verb 到.'}},
{u:8,t:'到 + place + 去 = go to a place',idea:'<b>到 + place + 去</b> wraps around the place: “go to …”. Add a verb after it to say what you’ll do there.',ex:[{c:'下课以后/T 我/S 到图书馆/P 去/V 看书/V',p:'Xià kè yǐhòu wǒ dào túshūguǎn qù kàn shū.',e:'After class I go to the library to read.'}],q:{k:'order',id:'o55'}},
{u:9,t:'Suggestion + 行吗？',idea:'Make a suggestion, then add <b>行吗？</b> or <b>行不行？</b> (“OK?”). Yes: <b>行 / 好 / 没问题</b>. No: start with <b>对不起</b> and give a reason.',ex:[{c:'老师/C ，/X 我/S 明天上午八点半/T 到/V 您的办公室/O ，/X 行吗/E',p:'Lǎoshī, wǒ míngtiān shàngwǔ bā diǎn bàn dào nín de bàngōngshì, xíng ma?',e:'Teacher, I’ll come to your office at 8:30 tomorrow morning, OK?'},{c:'对不起/C ，/X 我/S 明天上午八点半/T 要/H 开会/V',p:'Duìbuqǐ, wǒ míngtiān shàngwǔ bā diǎn bàn yào kāi huì.',e:'Sorry, I have a meeting at 8:30 tomorrow morning.'}],q:{k:'mc',q:'“我在图书馆等你，行吗？” Which reply means no?',o:['对不起，我要开会。','行。','没问题。'],a:0,why:'行 and 没问题 mean yes. Say no politely with 对不起 + a reason.'}},
{u:10,t:'别 + verb = don’t',idea:'<b>别</b> tells someone not to do something. It’s a helper word: right before the verb (or the 给 phrase). <b>请别</b> is more polite.',ex:[{c:'请/H 别/H 进来/V',p:'Qǐng bié jìnlai!',e:'Please don’t come in!'},{c:'他/S 很忙/V ，/X 别/H 给他/P 打/V 电话/O',p:'Tā hěn máng, bié gěi tā dǎ diànhuà!',e:'He’s very busy, don’t call him!'}],q:{k:'order',id:'o62'}},
{u:10,t:'别客气 = you’re welcome',idea:'<b>别客气</b> literally means “don’t be so polite”. It’s the usual reply to 谢谢.',ex:[{c:'谢谢/V 您/O',p:'Xièxie nín.',e:'Thank you.'},{c:'别/H 客气/V',p:'Bié kèqi.',e:'You’re welcome.'}],q:{k:'mc',q:'Your friend says “谢谢你请我喝奶茶！” You reply:',o:['别客气！','别看我！','没有意思！'],a:0,why:'别客气 = you’re welcome.'}},
{u:11,t:'Verb + 了 = it happened',idea:'<b>了</b> shows an action is done. With a plain object it can go after the verb or at the end (我看电影了 / 我看了电影). If the object has a number or describing word, put 了 <b>right after the verb</b>.',ex:[{c:'我/S 看了/V 两个外国电影/O',p:'Wǒ kàn le liǎng ge wàiguó diànyǐng.',e:'I watched two foreign movies.'}],q:{k:'mc',q:'“Yesterday I drank three bottles of beer.”',o:['昨天我喝了三瓶啤酒。','昨天了我喝三瓶啤酒。','昨天我了喝三瓶啤酒。'],a:0,why:'了 goes right after the verb 喝, because the object has a number (三瓶).'}},
{u:11,t:'没 + verb, with no 了',idea:'“Didn’t” is <b>没(有) + verb</b>, and 了 drops out. Compare <b>不</b> (don’t, as a habit): 我不喝咖啡 = I don’t drink coffee. 我今天没喝咖啡 = I didn’t drink coffee today.',ex:[{c:'昨天晚上/T 我/S 没/H 睡觉/V',p:'Zuótiān wǎnshang wǒ méi shuì jiào.',e:'Last night I didn’t sleep.'}],q:{k:'mc',q:'“I didn’t drink coffee today.”',o:['我今天没喝咖啡。','我今天没喝咖啡了。','我今天喝咖啡没。'],a:0,why:'没 + verb, and no 了.'}},
{u:11,t:'才 = not until (no 了!)',idea:'<b>才</b> means something happened later than expected. It goes right before the verb and <b>never takes 了</b>.',ex:[{c:'王朋和李友/S 晚上十二点/T 才/H 回家/V',p:'Wáng Péng hé Lǐ Yǒu wǎnshang shí’èr diǎn cái huí jiā.',e:'Wang Peng and Li You didn’t go home until midnight.'}],q:{k:'mc',q:'“He didn’t come until nine.”',o:['他九点才来。','他九点才来了。','他九点来才。'],a:0,why:'Time, then 才, then the verb, and no 了.'}}
];

{id:'o1',pat:'skel',en:'I’ll wait for you in the office.',h:'我在办公室等你。',p:'Wǒ zài bàngōngshì děng nǐ.',t:'我/S 在/P 办公室/P 等/V 你/O'},
{id:'o2',pat:'skel',en:'Tomorrow morning I’ll wait for you in the classroom.',h:'明天上午我在教室等你。',p:'Míngtiān shàngwǔ wǒ zài jiàoshì děng nǐ.',t:'明天上午/T 我/S 在/P 教室/P 等/V 你/O'},
{id:'o3',pat:'skel',en:'I have two classes tomorrow morning.',h:'明天上午我有两节课。',p:'Míngtiān shàngwǔ wǒ yǒu liǎng jié kè.',t:'明天上午/T 我/S 有/V 两/O 节/O 课/O'},
{id:'o4',pat:'skel',en:'Teacher Chang is going to give the second-years a test at 3 p.m. tomorrow.',h:'常老师明天下午三点要给二年级考试。',p:'Cháng lǎoshī míngtiān xiàwǔ sān diǎn yào gěi èr niánjí kǎo shì.',t:'常老师/S 明天下午三点/T 要/H 给/P 二年级/P 考试/V'},
{id:'o5',pat:'skel',en:'Where is the teacher’s office?',h:'老师的办公室在哪儿？',p:'Lǎoshī de bàngōngshì zài nǎr?',t:'老师的/S 办公室/S 在/V 哪儿/O'},
{id:'o6',pat:'skel',en:'Is now a good time for you? (Are you free now?)',h:'你现在方便吗？',p:'Nǐ xiànzài fāngbiàn ma?',t:'你/S 现在/T 方便/V 吗/E'},
{id:'o7',pat:'skel',en:'How many classes do you have today?',h:'今天你有几节课？',p:'Jīntiān nǐ yǒu jǐ jié kè?',t:'今天/T 你/S 有/V 几/O 节/O 课/O'},

/* ================= SLOT HELPERS ================= */
function parseC(str,sep){return str.split(sep||' ').map(x=>{const k=x.lastIndexOf('/');return [x.slice(0,k).replace(/_/g,' '),x.slice(k+1)];});}

function chipsHTML(arr,en){return `<div class='chips'>${arr.map(([x,s])=>chipH(x,s,en)).join('')}</div>`;}
function legend(keys){return `<div class='legend'>${(keys||['S','T','H','P','V','O','D','E']).map(k=>`<span class='chip s-${k}'><span class='c'></span><span class='l'>${SL[k]}</span></span>`).join('')}</div>`;}
function exHTML(x){return `<div class='ex'><div class='sub'>Example</div>${chipsHTML(parseC(x.c))}<div class='expy'>${x.p}</div><div>${x.e}</div>${x.en?`<div class='sub' style='margin-top:10px'>English order, for comparison:</div>${chipsHTML(parseC(x.en,'|'),true)}`:''}</div>`;}
/* ================= WORD ORDER ENGINE ================= */
function tilesOf(it){if(!it._t)it._t=parseC(it.t);return it._t;}
function orderVariants(it){

let vs=[base,...alts];
for(let r=0;r+1<runs.length;r++){
const A=runs[r],B=runs[r+1],a=t[A[0]][1],b=t[B[0]][1];
if(!((a==='S'&&b==='T')||(a==='T'&&b==='S')))continue;
const blk=[];for(let k=A[0];k<B[1];k++)blk.push(k);const na=A[1]-A[0],add=[];
vs.forEach(v=>{const f=v.indexOf(A[0]);if(f<0||!blk.every((k,q)=>v[f+q]===k))return;add.push([...v.slice(0,f),...blk.slice(na),...blk.slice(0,na),...v.slice(f+blk.length)]);});

}

function orderAccepts(it,str){orderVariants(it);return it._acc.has(str);}

while(i<n&&j<m){if(a[i]===b[j]){ka[i]=kb[j]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}

/* Explain which slot is out of place, comparing her order with the closest correct order. */
function orderHint(it,placed){
const t=tilesOf(it),her=placed.map(k=>t[k][0]);

const occ=a=>{const c={};return a.map(x=>x+'#'+(c[x]=(c[x]||0)+1));};
const Tg=occ(best.tg),hpos={};occ(her).forEach((k,i)=>hpos[k]=i);

}
function orderWidget(box,it,opts){

/* ================= A · SENTENCE STRUCTURE ================= */
function passed(i){const m=M['st'+i+'|step'];return !!(m&&m.r>0);}

function structure(){

h(`${back()}<div class='card'><h2>Sentence structure</h2><div class='sub'>Start from zero. Each step is one idea, an example from the lesson, then a quick check. Every Chinese sentence here is built from these coloured slots:</div>
${legend()}
<div class='row' style='margin-top:14px'><button class='btn pri' onclick='step(${next<0?0:next})'>${next<0?'All done · review from step 1':next===0?'Start step 1 →':'Continue with step '+(next+1)+' →'}</button></div></div>
${UNITS.map((u,ui)=>{const idx=unitSteps(ui),d=idx.filter(passed).length;return `<button class='mode' style='width:100%;margin-bottom:10px' onclick='step(${idx[0]})'><b>${u} <span class='${d===idx.length?'ok':'sub'}' style='font-weight:400'>${d===idx.length?'✓':d+'/'+idx.length}</span></b><span class='sub'>${idx.map(i=>STEPS[i].t).join(' · ')}</span></button>`;}).join('')}`);

function step(i){
cancelAll();
const s=STEPS[i],idx=unitSteps(s.u),k=idx.indexOf(i);
h(`${back('structure()')}<div class='card'><div class='row between'><span class='pill'>${UNITS[s.u]}</span><span class='sub'>Step ${k+1} of ${idx.length} · ${i+1}/${STEPS.length} overall</span></div>
<h2 style='margin-top:12px'>${s.t}</h2><div class='idea'>${s.idea}</div>
${s.ex.map(exHTML).join('')}
<div class='qc'><b>Quick check</b><div id='qc'></div></div>
<div id='nav' class='row' style='margin-top:14px'></div></div>`);
const nav=()=>{const last=i===STEPS.length-1,endUnit=k===idx.length-1;
$('#nav').innerHTML=`${last?`<button class='btn pri' onclick='structure()'>Finish · all units</button>`:`<button class='btn pri' onclick='step(${i+1})'>${endUnit?'Next unit →':'Next step →'}</button>`}<button class='btn' onclick='step(${i})'>Try this check again</button>`;};
const q=s.q;
if(q.k==='mc'){
const order=shuffle(q.o.map((o,j)=>j));
$('#qc').innerHTML=`<div class='prompt'>${q.q}</div>${order.map(j=>`<button class='btn opt' data-o='${j}'>${q.o[j]}</button>`).join('')}<div id='qfb'></div>`;
let answered=false;
$('#qc').onclick=e=>{const b=e.target.closest('[data-o]');if(!b||answered)return;answered=true;const j=+b.dataset.o,ok=j===q.a;
rec('st'+i,'step',ok);
$('#qc').querySelectorAll('[data-o]').forEach(x=>{const y=+x.dataset.o;if(y===q.a)x.classList.add('right');else if(y===j)x.classList.add('wrong');x.disabled=true;});
$('#qfb').innerHTML=`<div class='fb'><b class='${ok?'ok':'bad'}'>${ok?'✓ Right.':'✗ Not that one.'}</b> ${q.why}</div>`;nav();};
}else{
const it=ORDER.find(o=>o.id===q.id);
orderWidget($('#qc'),it,{onResult:(first,solved)=>{rec('st'+i,'step',solved);rec(it.id,'order',first);nav();}});
}
}
/* ================= B · WORD BUILDING ================= */
let lastB=null;
function buildHome(){
cancelAll();
h(`${back()}<div class='card'><h2>Word building</h2><div class='sub'>Most Lesson 6 words are two or three characters, and each character has its own meaning. Knowing the pieces makes the words easier to remember and to write.</div>
<div class='grid' style='margin-top:14px'>
<button class='mode new' onclick='buildLearn(0)'><b>1 · How words are made</b><span class='sub'>${BUILD.length} words, piece by piece.</span></button>
<button class='mode new' onclick='buildQuiz()'><b>2 · Build the word</b><span class='sub'>Read the English and tap the character tiles to build it.</span></button>
<button class='mode new' onclick='families()'><b>3 · Word families</b><span class='sub'>Words that share a character, grouped together.</span></button>
</div></div>`);
}
function partsHTML(b){return `<div class='parts'>${b.parts.map((p,j)=>`${j?`<span class='op'>+</span>`:''}<div class='part'><div class='c'>${p[0]}</div><div class='expy'>${p[1]}</div><div class='m'>${p[2]}</div></div>`).join('')}<span class='op'>=</span><div class='part' style='border-color:var(--ink)'><div class='c'>${b.w}</div><div class='expy'>${b.p}</div><div class='m'>${b.e}</div></div></div>`;}
function buildLearn(i){
cancelAll();
const b=BUILD[i];
h(`${back('buildHome()')}<div class='card'><div class='row between'><span class='pill'>How words are made</span><span class='sub'>${i+1} / ${BUILD.length}</span></div>
<div class='big' style='font-size:64px'>${b.w}</div><div class='py s'>${b.p}</div><div class='sub' style='text-align:center'>${b.e}</div>
${partsHTML(b)}
<div class='fb'>${b.how}</div>
<div class='row between' style='margin-top:14px'><button class='btn' ${i?'':'disabled'} onclick='buildLearn(${i-1})'>← Previous</button>${i<BUILD.length-1?`<button class='btn pri' onclick='buildLearn(${i+1})'>Next word →</button>`:`<button class='btn pri' onclick='buildQuiz()'>Try building them →</button>`}</div></div>`);
}
function buildQuiz(){
cancelAll();
const list=BUILD.filter(b=>!b.comp),b=pick(list,'build',lastB,x=>x.w);lastB=b;
const need=[...b.w],pool=[...new Set(list.flatMap(x=>[...x.w]))].filter(c=>!need.includes(c));
const tiles=shuffle([...need,...shuffle(pool).slice(0,Math.max(3,6-need.length))]);
let slots=need.map(()=>null),done=false;
h(`${back('buildHome()')}<div class='card'><div class='row between'><span class='pill'>Build the word</span><span class='sub'>${need.length} characters</span></div>
<div class='prompt' style='text-align:center'>${b.e}</div>
<div class='slots' id='slots'></div><div class='bank' id='bank'></div>
<div class='row center' style='margin-top:14px'><button class='btn pri' id='chk' disabled>Check</button><button class='btn' id='clr'>Clear</button><button class='btn' id='hint'>Hint: pinyin</button></div><div id='fb'></div></div>`);
const used=()=>slots.filter(x=>x!==null);
function render(){
$('#slots').innerHTML=slots.map((x,j)=>`<button class='slotbox${x!==null?' f':''}' data-s='${j}' aria-label='slot ${j+1}'>${x!==null?tiles[x]:''}</button>`).join('');
$('#bank').innerHTML=done?'':tiles.map((c,k)=>used().includes(k)?'':`<button class='tile' data-t='${k}'>${c}</button>`).join('');
$('#chk').disabled=done||used().length<need.length;
}
$('#slots').onclick=e=>{const s=e.target.closest('[data-s]');if(!s||done)return;slots[+s.dataset.s]=null;render();};
$('#bank').onclick=e=>{const tt=e.target.closest('[data-t]');if(!tt||done)return;const j=slots.indexOf(null);if(j<0)return;slots[j]=+tt.dataset.t;render();};
$('#clr').onclick=()=>{if(done)return;slots=need.map(()=>null);render();};
$('#hint').onclick=()=>{$('#hint').outerHTML=`<span class='sub'>${b.p}</span>`;};
$('#chk').onclick=()=>{
if(done){buildQuiz();return;}
const got=slots.map(x=>tiles[x]).join(''),ok=got===b.w;done=true;rec(b.w,'build',ok);
render();
$('#fb').innerHTML=`<div class='fb'><b class='${ok?'ok':'bad'}'>${ok?'✓ Right!':'✗ You built '+got+'.'}</b> ${b.w} · ${b.p}${partsHTML(b)}<div>${b.how}</div></div>`;
$('#chk').disabled=false;$('#chk').textContent='Next word →';
};
render();
onEnter(()=>{if(!$('#chk').disabled)$('#chk').click();});
}
function families(){
cancelAll();
h(`${back('buildHome()')}<div class='card'><h2>Word families</h2><div class='sub'>Words that share a character usually share part of their meaning.</div></div>
${FAM.map(f=>`<div class='card'><h2>${f.k}</h2><table class='fit fam'>${f.items.map(x=>`<tr><td class='hz'>${x[0]}</td><td>${x[1]}<br><span class='sub'>${x[2]}</span></td></tr>`).join('')}</table>${f.note?`<div class='sub' style='margin-top:8px'>${f.note}</div>`:''}</div>`).join('')}`);
}
/* ================= C · WORD ORDER ================= */
let opat='all',lastO=null;
function wordOrder(){
cancelAll();
const list=opat==='all'?ORDER:ORDER.filter(o=>o.pat===opat),it=pick(list,'order',lastO,o=>o.id);lastO=it;
const cnt=k=>ORDER.filter(o=>o.pat===k).length;
h(`${back()}<div class='card'><div class='row between'><span class='pill'>Word order · ${PATS[it.pat]}</span><span class='sub'>${pct(avg(list.map(o=>mastery(o.id,'order'))))} learned</span></div>
<label class='f' for='pat'>Practice</label><select id='pat'><option value='all'>All patterns (${ORDER.length} sentences)</option>${Object.keys(PATS).map(k=>`<option value='${k}' ${opat===k?'selected':''}>${PATS[k]} (${cnt(k)})</option>`).join('')}</select>
<div id='ow'></div>
<div class='row' style='margin-top:14px;justify-content:flex-end'><button class='btn' id='nx'>Next sentence →</button></div></div>
<p class='sub'>Time can go before or after the subject, and both orders are accepted. When something’s off, you’ll see which slot to move.</p>`);
const w=orderWidget($('#ow'),it,{onResult:ok=>{rec(it.id,'order',ok);$('#nx').classList.add('pri');}});
$('#pat').onchange=e=>{opat=e.target.value;wordOrder();};
$('#nx').onclick=wordOrder;
onEnter(()=>{const c=$('#ow [data-act=check]');if(c&&!c.disabled)c.click();else if($('#nx').classList.contains('pri'))wordOrder();});
}
/* ================= D · SLOT BUILDER ================= */
const sbs={S:0,T:2,H:1,P:1,V:5};let sbNote='';
function slotBuilder(){
cancelAll();
h(`${back()}<div class='card'><h2>Slot builder</h2><div class='sub'>Pick one thing for each slot. Your sentence is put together in Chinese order, with the English order underneath for comparison.</div><div id='sb'></div></div>`);
sbRender();
}
function sbPick(slot,j){
sbNote='';sbs[slot]=j;
const S=SB.S[sbs.S],H=SB.H[sbs.H],P=SB.P[sbs.P],V=SB.V[sbs.V];
if(slot==='H'&&H.k==='bie'&&S.z!=='你'){sbs.S=1;sbNote='别 tells someone not to do something, so the subject switched to 你.';}
if(slot==='S'&&H.k==='bie'&&S.z!=='你'){sbs.H=0;sbNote='别 only works when you’re telling “you” not to do something, so the helper was cleared.';}
if(slot==='P'&&P.k==='gei'&&V.v!=='打'){sbs.V=0;sbNote='Here 给 + person goes with 打电话 (call someone), so the verb switched to 打电话.';}
if(slot==='V'&&P.k==='gei'&&V.v!=='打'){sbs.P=0;sbNote='给 + person goes with 打电话 here, so the place slot was cleared.';}
sbRender();
}
function sbCompose(){
const S=SB.S[sbs.S],T=SB.T[sbs.T],H=SB.H[sbs.H],P=SB.P[sbs.P],V=SB.V[sbs.V],third=S.f===3,k=H.k,conj=(!k||k==='often')&&third;
const zh=[[S.z,'S']];if(T.z)zh.push([T.z,'T']);if(H.z)zh.push([H.z,'H']);if(P.z)zh.push([P.z,'P']);zh.push([V.v,'V'],[V.o,'O']);
const pys=[S.p];if(T.z)pys.push(T.p);if(H.z)pys.push(H.p);if(P.z)pys.push(P.p);pys.push(V.vp+' '+V.op);
for(let j=0;j<pys.length-1;j++)if(pys[j]==='bù'&&/[àèìòùǜ]/.test(pys[j+1].split(' ')[0]))pys[j]='bú';
const bang=k==='bie',py=pys.join(' ');
const en=[];
if(bang)en.push(['Don’t','H']);
else{en.push([S.e,'S']);
if(k==='yao')en.push([(S.f===1?'am':third?'is':'are')+' going to','H']);
else if(k==='xiang')en.push([third?'wants to':'want to','H']);
else if(k==='bu'||k==='cai')en.push([third?'doesn’t':'don’t','H']);
else if(k==='often')en.push(['often','H']);}
const vb=V.ve[conj?1:0];
if(P.k==='gei')en.push([conj?'calls':'call','V'],[P.e,'P']);
else if(P.k==='dao')en.push([(conj?'goes':'go')+' to '+P.e,'P'],['to '+V.ve[0],'V'],[V.oe,'O']);
else{en.push([vb,'V'],[V.oe,'O']);if(P.k==='zai')en.push([P.e,'P']);}
let warn='';
if(T.z)en.push([k==='cai'?'until '+T.u:T.e,'T']);
else if(k==='cai')warn='才 needs a time before it (才 = not until that time). Pick a time.';
let es=en.map(x=>x[0]).join(' ');es=es[0].toUpperCase()+es.slice(1)+(bang?'!':'.');
return {zh,py:py[0].toUpperCase()+py.slice(1)+(bang?'!':'.'),hz:zh.map(x=>x[0]).join('')+(bang?'！':'。'),en,es,warn};
}
function sbRender(){
const r=sbCompose();
const row=(slot,label,opts,txt)=>`<div class='sblabel'>${chipH('',slot,false,false).replace(`<span class='c'></span>`,'')}<span>${label}</span></div><div class='choice s-${slot}'>${opts.map((o,j)=>`<button class='btn${sbs[slot]===j?' on':''}' onclick='sbPick("${slot}",${j})'>${txt(o)}</button>`).join('')}</div>`;
$('#sb').innerHTML=`<div class='ex'><div class='sub'>Your sentence, in Chinese order</div>${chipsHTML(r.zh)}<div class='hz' style='font-size:26px'>${r.hz}</div><div class='expy'>${r.py}</div>
${r.warn?`<div class='note'>${r.warn}</div>`:`<div class='sub' style='margin-top:10px'>English order:</div>${chipsHTML(r.en,true)}<div>${r.es}</div>`}
${sbNote?`<div class='note'>${sbNote}</div>`:''}</div>
${row('S','Subject: who?',SB.S,o=>o.z)}
${row('T','Time: when? (goes before the verb)',SB.T,o=>o.z||'none')}
${row('H','Helper word',SB.H,o=>o.z?o.z+' <span class=sub>'+o.e+'</span>':'none')}
${row('P','Place / 给 / 到 phrase (before the verb)',SB.P,o=>o.z||'none')}
${row('V','Verb + object',SB.V,o=>o.v+o.o)}`;
}
/* ================= E · TRANSLATE ================= */
let lastT=null;
function normZh(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s，。？！、,.?!；;：:“”"'‘’()（）—\-]/g,'').replace(/儿/g,'');}
function translate(){
cancelAll();
const it=pick(TR,'tr',lastT,x=>x.id);lastT=it;
h(`${back()}<div class='card'><div class='row between'><span class='pill'>Translate · ${it.src}</span><span class='sub'>${pct(avg(TR.map(t=>mastery(t.id,'tr'))))} learned</span></div>
<div class='prompt'>${it.en}</div>${it.cue?`<div class='sub'>Use: <span class='hz' style='font-size:18px'>${it.cue}</span></div>`:''}
<label class='f' for='zh'>Your Chinese (type it, or say it aloud or write it on paper first)</label><textarea id='zh' lang='zh-Hans' autocomplete='off' spellcheck='false'></textarea>
<div class='row' style='margin-top:12px'><button class='btn pri' id='show'>Show model answer</button><button class='btn' id='hint'>Pattern hint</button></div>
<div id='hb'></div><div id='fb'></div></div>`);
$('#hint').onclick=()=>{$('#hb').innerHTML=`<div class='fb'><b>Pattern:</b> ${it.hint}</div>`;$('#hint').disabled=true;};
$('#show').onclick=()=>{
const mine=normZh($('#zh').value),acc=[it.a,...(it.acc||[])].map(normZh),hit=mine&&acc.includes(mine);
$('#show').style.display='none';$('#hint').style.display='none';$('#hb').innerHTML='';
$('#fb').innerHTML=`<div class='fb'><div class='hz' style='font-size:26px'>${it.a}</div><div class='expy'>${it.p}</div><div style='margin-top:6px'><b>Pattern:</b> ${it.hint}</div>
${mine?(hit?`<div class='ok' style='margin-top:6px'><b>✓ Yours matches an accepted answer.</b></div>`:`<div style='margin-top:6px'><b>Yours:</b> <span class='hz' style='font-size:20px'>${esc($('#zh').value)}</span><div class='sub'>Not an exact match. Compare slot by slot: time before or after the subject are both fine.</div></div>`):''}
<div class='row' style='margin-top:10px' id='sa'><button class='btn' id='y'>I got it</button><button class='btn' id='n'>Not yet</button></div></div>`;
const fin=ok=>{rec(it.id,'tr',ok);$('#sa').innerHTML=`<button class='btn pri' id='nx'>Next →</button>`;$('#nx').onclick=translate;$('#nx').focus();};
$('#y').onclick=()=>fin(true);$('#n').onclick=()=>fin(false);
if(hit)$('#y').focus();
};
}
home();
</script>
</body>
</html>
